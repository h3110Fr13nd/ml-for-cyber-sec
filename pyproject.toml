[project]
name = "ml-for-cyber-sec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "h3110Fr13nd", email = "vijaysinghkushwaha3737@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ml-for-cyber-sec = "ml_for_cyber_sec:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]
torch = [
    "torch>=2.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
explicit = true
url = "https://download.pytorch.org/whl/cpu"
